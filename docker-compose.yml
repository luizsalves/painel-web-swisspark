name: painel-swisspark

services:
  # ==========================================================================
  # API (.NET) â€” sem porta publicada: sÃ³ o nginx alcanÃ§a
  # ==========================================================================
  api:
    build:
      context: ./backend
      dockerfile: PainelWebSwissPark.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # Dois sublinhados viram ":" na configuraÃ§Ã£o do ASP.NET Core:
      # ConnectionStrings__Contabil Ã© o mesmo que "ConnectionStrings:Contabil"
      # do keys.json. Duas formas de entregar o segredo, escolha uma:
      #
      #   (a) por aqui, a partir do .env  â€” uma variÃ¡vel por conexÃ£o
      #   (b) montando o secrets/keys.json â€” descomente o bloco volumes abaixo
      #
      # O caminho (b) escala melhor: as seis conexÃµes vÃªm do arquivo e ligar uma
      # nova nÃ£o exige mexer neste compose. Pelo (a), cada conexÃ£o que o cÃ³digo
      # passar a usar precisa de mais uma linha aqui.
      #
      # Vazio nÃ£o quebra o compose: a aplicaÃ§Ã£o recusa subir com uma mensagem
      # dizendo qual keys.json ela leu e qual chave faltou.
      ConnectionStrings__Totvs_01: ${PAINEL_TOTVS_01_CONNECTION_STRING:-}
      PainelDb__Schema: ${PAINEL_DB_SCHEMA:-public}
      PainelDb__CacheSeconds: ${PAINEL_DB_CACHE_SECONDS:-0}

      # Chave que assina os tokens de sessÃ£o. MÃ­nimo de 32 bytes; a aplicaÃ§Ã£o
      # recusa subir com menos. Gere com: openssl rand -base64 48
      # Pode vir do keys.json em vez daqui (Auth:JwtSigningKey).

      # Primeiro administrador, criado na primeira subida se a bi_users ainda nÃ£o
      # tiver nenhum administrador ativo. A senha entra como provisÃ³ria.
      # Depois do primeiro acesso, apague as duas do .env.
      PAINEL_ADMIN_EMAIL: ${PAINEL_ADMIN_EMAIL:-}
      PAINEL_ADMIN_PASSWORD: ${PAINEL_ADMIN_PASSWORD:-}
      PAINEL_ADMIN_NAME: ${PAINEL_ADMIN_NAME:-}

      # O TLS termina no nginx; redirecionar aqui dentro daria laÃ§o de redirect.
      Hosting__UseHttpsRedirection: "false"
      Hosting__UseForwardedHeaders: "true"

    # (b) Usar o secrets/keys.json em vez do .env: descomente as quatro linhas.
    # create_host_path: false faz o container falhar se o arquivo nÃ£o existir,
    # em vez de o Docker criar um diretÃ³rio vazio no lugar.
    volumes:
      - type: bind
        source: ./secrets/keys.json
        target: /app/secrets/keys.json
        read_only: true
        bind:
          create_host_path: false

    # Para um Postgres que roda na prÃ³pria mÃ¡quina hospedeira, use
    # host.docker.internal como Host na connection string.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    restart: unless-stopped
    networks: [painel]

  # ==========================================================================
  # Front (nginx) â€” serve o SPA e repassa /api para a API
  # Mesma origem para o navegador, entÃ£o CORS nem entra na conversa.
  # ==========================================================================
  web:
    build:
      context: ./frontend
    environment:
      PAINEL_API_URL: /api

    ports:
      - "${PAINEL_PORTA:-8080}:8080"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped
    networks: [painel]

networks:
  painel:
    driver: bridge
