server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança. CSP fica de fora: o MSAL precisa falar com o
    # login.microsoftonline.com e uma política errada quebra o login em silêncio.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A API mora no mesmo domínio por trás do nginx: o navegador enxerga tudo como
    # mesma origem e a questão de CORS simplesmente não existe.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Os assets levam hash no nome — trocou o conteúdo, trocou a URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reescrito a cada start do container: cachear aqui seria servir a
    # configuração do deploy anterior.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # As rotas são resolvidas no navegador. Sem isso, recarregar a página em
    # /usuarios devolve 404 em vez da aplicação.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
